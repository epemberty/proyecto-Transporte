<style>
  .dashboard-card {
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border-radius: 12px;
  }
  .dashboard-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 8px 16px rgba(0,0,0,0.1) !important;
  }
  .icon-box {
    width: 44px;
    height: 44px;
    font-size: 1.3rem;
    border-radius: 10px;
  }
</style>

<div class="container py-4">
  <h2 class="mb-4 text-center fw-bold">Panel Principal</h2>

  <div class="row row-cols-1 row-cols-md-3 g-4">
    <div class="col" *ngFor="let item of [
      { label: 'Conductores', path: '/conductor', icon: 'bi-person-badge', bg: 'bg-primary' },
      { label: 'Vehículos', path: '/vehiculo', icon: 'bi-truck', bg: 'bg-dark' },
      { label: 'Contratos', path: '/contrato', icon: 'bi-file-earmark-text', bg: 'bg-warning text-dark' },
      { label: 'Rutas', path: '/ruta', icon: 'bi-map', bg: 'bg-info text-dark' },
      { label: 'Minas', path: '/mina', icon: 'bi-geo-alt', bg: 'bg-success' },
      { label: 'Destinos', path: '/destino', icon: 'bi-box-seam', bg: 'bg-danger' },
      { label: 'Tiquetes', path: '/tiquete', icon: 'bi-receipt', bg: 'bg-secondary' },
      { label: 'Informes', path: '/reportes/tiquetes', icon: 'bi-bar-chart-line', bg: 'bg-primary' }
    ]">
      <div class="card h-100 shadow-sm border-0 dashboard-card">
        <div class="card-body d-flex flex-column justify-content-between p-4">
          <div>
            <div class="icon-box {{ item.bg }} text-white d-flex align-items-center justify-content-center mb-3">
              <i class="bi {{ item.icon }}"></i>
            </div>
            <h5 class="card-title fw-bold">{{ item.label }}</h5>
          </div>
          <a [routerLink]="item.path" class="btn btn-outline-primary mt-3 w-100 d-flex align-items-center justify-content-center gap-2">
            <span>Ir a {{ item.label }}</span>
            <i class="bi bi-arrow-right"></i>
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
